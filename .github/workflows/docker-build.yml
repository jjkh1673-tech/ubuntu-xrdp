name: Docker build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Every push and pull request builds the image, which is the check itself: a Dockerfile that
      # cannot produce a working image never reaches main. Pushes to main also publish it, so
      # `docker pull` works without cloning and the desktop's own System Upgrade tool has something
      # to point at (see /etc/ubuntu-image-ref in the image).
      - name: Build image (and publish it on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:26.04
