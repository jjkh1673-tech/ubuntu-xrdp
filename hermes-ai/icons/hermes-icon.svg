<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="wing-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="body-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#ffaa00"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg-gradient)"/>
  <rect width="512" height="512" rx="80" fill="none" stroke="#30363d" stroke-width="3"/>
  
  <!-- Hermes wings symbol (stylized) -->
  <g transform="translate(256, 220)">
    <!-- Left wing -->
    <path d="M-20,0 Q-80,-60 -140,-40 Q-100,-20 -80,0 Q-100,20 -140,40 Q-80,60 -20,0 Z" 
          fill="url(#wing-gradient)" opacity="0.9"/>
    <!-- Right wing -->
    <path d="M20,0 Q80,-60 140,-40 Q100,-20 80,0 Q100,20 140,40 Q80,60 20,0 Z" 
          fill="url(#wing-gradient)" opacity="0.9"/>
    <!-- Center body -->
    <ellipse cx="0" cy="0" rx="35" ry="50" fill="url(#body-gradient)"/>
    <!-- Caduceus staff -->
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <path d="M-15,-30 Q0,-20 15,-30" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <path d="M-15,10 Q0,20 15,10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Text -->
  <text x="256" y="380" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">HERMES</text>
  <text x="256" y="415" font-family="Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="middle" letter-spacing="4">AI AGENT</text>
</svg>