; ==============================================================================
; PulseAudio Client Configuration for XRDP
; ==============================================================================
; This configuration enables PulseAudio support for XRDP remote desktop sessions.
; It is copied to /etc/pulse/client.conf during Docker build.
;
; PURPOSE:
;   - Allows audio from the container to be transmitted to RDP clients
;   - Configures PulseAudio to use the XRDP-provided audio socket
;
; COMPATIBILITY:
;   - Works on Debian, Ubuntu, and other PulseAudio-based distributions
;   - No distribution-specific changes needed
; ==============================================================================

; Server connection settings
; Use the Unix socket provided by XRDP for audio transmission
default-server = unix:/run/pulse/native

; Disable automatic PulseAudio daemon spawning
; The daemon is started manually in start.sh for better container control
autospawn = no

; Binary path for daemon (set to /bin/true as we manage the daemon externally)
daemon-binary = /bin/true
